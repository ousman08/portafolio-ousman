<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada — Ousman Krubally</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 2rem;
      }
      main {
        width: 100%;
        max-width: 34rem;
      }
      .mark {
        width: 44px;
        height: 44px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: #c9a24b;
      }
      .code {
        margin: 2rem 0 0;
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        font-size: 0.66rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #c9a24b;
      }
      h1 {
        margin: 0.9rem 0 0;
        font-size: clamp(2rem, 7vw, 3.2rem);
        line-height: 1.02;
        letter-spacing: -0.04em;
        font-weight: 600;
      }
      p {
        margin: 1.1rem 0 0;
        color: #a3a3a3;
        font-size: 0.95rem;
        line-height: 1.65;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0.8rem 1.4rem;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      }
      a:focus-visible {
        outline: 2px solid #6fb4ff;
        outline-offset: 3px;
      }
      .primary {
        background: #c9a24b;
        color: #0a0a0a;
      }
      .primary:hover {
        background: #e6bc6a;
      }
      .ghost {
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #fff;
      }
      .ghost:hover {
        border-color: rgba(201, 162, 75, 0.6);
        color: #e6bc6a;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 40 40" fill="none">
          <g fill="currentColor" transform="rotate(-38 20 20)">
            <rect x="9.6" y="9.4" width="20.8" height="5.4" rx="1.2" />
            <rect x="18.4" y="14.2" width="3.2" height="16.4" rx="1.6" />
          </g>
        </svg>
      </div>

      <p class="code">Error 404</p>
      <h1>Esta puerta no existe.</h1>
      <p>
        La dirección que has visitado no corresponde a ninguna página del portafolio. Puede que se
        haya movido o que falte una letra.
      </p>

      <div class="actions">
        <a class="primary" href="/">Volver al inicio</a>
        <a class="ghost" href="mailto:oman7910@gmail.com">Escribir un correo</a>
      </div>
    </main>
  </body>
</html>
